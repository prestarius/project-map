name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run tests
        run: python -m unittest discover -s tests -v

      - name: Render example
        run: python scripts/render.py examples/project-map.json -o .project-map/example.html

      - name: Render dogfood map
        run: python scripts/render.py project-map.json -o .project-map/index.html
