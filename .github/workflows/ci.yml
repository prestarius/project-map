name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate project map
        run: python -m project_map validate

      - name: Run tests
        run: python -m unittest discover -s tests -v

      - name: Render example through CLI
        run: python -m project_map --map examples/project-map.json render -o .project-map/example.html

      - name: Render dogfood map through CLI
        run: python -m project_map render -o .project-map/index.html
